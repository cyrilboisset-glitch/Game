<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#10151c">
<title>Pontcharra</title>
<link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#10151c"><link rel="icon" href="./icons/icon-192.png"><link rel="apple-touch-icon" href="./icons/icon-192.png"><meta name="mobile-web-app-capable" content="yes">
<style>
html,body{margin:0;height:100%;height:100dvh;overscroll-behavior:none;-webkit-user-select:none;user-select:none;background:#000;overflow:hidden;font-family:system-ui,sans-serif;touch-action:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 1px 3px #000a}
.pill{position:absolute;background:rgba(10,14,20,.55);backdrop-filter:blur(6px);padding:6px 12px;border-radius:10px;font-weight:600;font-size:14px}
#loading{position:fixed;inset:0;background:#10151c;color:#cfd8e3;display:flex;align-items:center;justify-content:center;font-size:18px}
#bars{right:14px;top:14px;left:auto;width:150px;padding:8px 10px;z-index:2}.bar{display:flex;align-items:center;gap:6px;font-size:11px;margin:3px 0}.bar span{width:46px}.bar i{flex:1;height:7px;background:#0007;border-radius:4px;overflow:hidden}.bar b{display:block;height:100%}.bar.warn span{color:#ff8a7a}
#minimap{position:fixed;left:14px;top:132px;width:150px;height:150px;border-radius:50%;border:2px solid #fff6;pointer-events:none}
#veil{position:fixed;inset:0;background:#000;opacity:0;transition:opacity .6s;pointer-events:none}
#alert{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;box-shadow:inset 0 0 90px 10px rgba(220,30,30,.0)}#alert.on{opacity:1;animation:siren 1s infinite}#alert.on.seen{animation-duration:.5s}@keyframes siren{0%,100%{box-shadow:inset 0 0 120px 14px rgba(230,30,40,.45)}50%{box-shadow:inset 0 0 120px 14px rgba(40,90,255,.5)}}
#prompt{background:rgba(10,14,20,.7)}.ui{position:fixed;touch-action:none;user-select:none;z-index:5}
#joy{left:24px;bottom:34px;width:130px;height:130px;border-radius:50%;background:#fff1;border:2px solid #fff4;position:fixed;opacity:.55;transition:opacity .15s}#joy.on{opacity:1;background:#fff2}#knob{position:absolute;left:41px;top:41px;width:48px;height:48px;border-radius:50%;background:#fffa}
#phoneBtn{position:fixed;right:14px;top:228px;width:46px;height:46px;border-radius:12px;border:2px solid #fff6;background:#1a2230dd;color:#fff;font-size:22px;z-index:8}#phoneBtn.badge::after{content:attr(data-badge);position:absolute;right:-6px;top:-6px;background:#e0443a;color:#fff;border-radius:10px;font:700 11px system-ui;padding:2px 6px}
#phone{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,94vw);height:min(760px,92vh);background:#0d1218f2;border:2px solid #3a4655;border-radius:26px;z-index:30;flex-direction:column;color:#fff;font:13px system-ui;overflow:hidden}
#phone .ph-top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #fff2}#phone .ph-top .ph-clock{flex:1;text-align:right;opacity:.75}#phone .ph-top button{background:none;border:0;color:#fff;font-size:20px}
#phone .ph-body{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}#phone .ph-map{width:100%;flex:1;min-height:300px;border-radius:12px;touch-action:none}
#phone .ph-row{display:flex;gap:6px;flex-wrap:wrap}#phone button{padding:8px 12px;border-radius:10px;border:1px solid #fff4;background:#1f2a38;color:#fff;font:600 13px system-ui;margin-top:4px}
#phone .ph-tabs{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid #fff2}#phone .ph-tabs button{border:0;border-radius:0;background:none;margin:0;padding:8px 0;font-size:11px;line-height:1.3;opacity:.7}#phone .ph-tabs button.on{opacity:1;background:#ffffff14}
#phone .ph-card{background:#ffffff0f;border-radius:12px;padding:10px 12px;line-height:1.45}#phone .ph-from{font-weight:700;margin-bottom:3px}#phone .ph-from span,#phone .ph-sub{opacity:.7;font-weight:400;font-size:12px}#phone .ph-empty{opacity:.65;text-align:center;margin-top:20px}#phone .ph-ok{color:#7ddc8a;margin-top:4px}#phone .ph-legend{font-size:11px;opacity:.75;line-height:1.5}
#phone .ph-bar{height:6px;background:#ffffff1c;border-radius:4px;margin:6px 0}#phone .ph-bar i{display:block;height:100%;border-radius:4px}
@media (pointer:coarse){#phoneBtn{top:140px}}
#pad{position:fixed;right:14px;bottom:18px;width:250px;height:240px;pointer-events:none}#pad .rb{pointer-events:auto;position:absolute;border-radius:50%;border:2px solid #fff6;background:#1a2230cc;color:#fff;font:700 13px system-ui;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;touch-action:none;user-select:none;-webkit-user-select:none;line-height:1.1}
#bA{right:0;bottom:0;width:98px;height:98px;background:#2f6bd8e0!important;font-size:15px!important}#bA.off{opacity:.35}#bB{right:104px;bottom:4px;width:78px;height:78px;background:#b4383ad8!important}#bC{right:6px;bottom:106px;width:68px;height:68px}#bD{right:90px;bottom:92px;width:60px;height:60px;font-size:11px!important}#bM{right:20px;bottom:186px;width:46px;height:46px;font-size:20px!important}
#pad .rb.down,.chip.down,#tpanel button.down{filter:brightness(1.6);transform:scale(.94)}
#chips{position:fixed;right:14px;bottom:262px;display:flex;flex-wrap:wrap-reverse;justify-content:flex-end;gap:8px;max-width:62vw}.chip{height:42px;padding:0 15px;border-radius:21px;border:2px solid #ffd34a99;background:#2a2410d8;color:#ffe9a8;font:700 13px system-ui;touch-action:none;user-select:none}
#tpanel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(3,98px);gap:10px;padding:14px;border-radius:16px;background:rgba(10,14,20,.92);z-index:20}#tpanel button{height:58px;border-radius:14px;border:2px solid #fff5;background:#1a2230;color:#fff;font:700 13px system-ui;touch-action:none}#tpanel .x{grid-column:1/-1;height:44px;background:#3a2020}
@media (pointer:coarse){#reset,#gear{display:none!important}#prompt{top:26%!important;bottom:auto!important;max-width:64vw;font-size:13px;text-align:center;white-space:normal}}
@media (pointer:coarse) and (orientation:landscape) and (max-height:500px){#prompt{top:36%!important;font-size:12px}#toast{top:16%!important;max-width:58vw;font-size:12px}}
@media (orientation:landscape) and (max-height:500px){#pad{transform:scale(.8);transform-origin:right bottom}#chips{right:226px;bottom:14px;max-width:calc(100vw - 440px)}}
#observe{right:14px;top:150px;width:260px;max-height:62vh;overflow:auto;background:rgba(10,14,20,.78);backdrop-filter:blur(6px);color:#fff;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.5;z-index:6}
#observe h3{margin:0;font-size:15px}#observe small{opacity:.7;font-weight:400}#observe .m{opacity:.85;margin-bottom:4px}#observe .now{margin:6px 0;color:#ffd34a}#observe ul{margin:4px 0 8px;padding-left:16px;max-height:170px;overflow:auto}
#observe .sp{display:flex;gap:6px}#observe button{flex:1;padding:6px 0;border-radius:8px;border:1px solid #fff5;background:#1a2230;color:#fff;font:600 12px system-ui}#observe button.on{background:#3a6fd8}
#missions{left:50%;top:12%;transform:translateX(-50%);width:min(440px,92vw);max-height:70vh;overflow:auto;background:rgba(10,14,20,.88);backdrop-filter:blur(8px);color:#fff;border-radius:14px;padding:12px 14px;font-size:13px;z-index:8}
#missions h3{margin:0 0 8px;font-size:16px}#missions h3 small{opacity:.7;font-weight:400;font-size:12px}#missions .row{padding:8px 10px;margin:6px 0;border-radius:10px;background:#ffffff12;cursor:pointer}#missions .row.sel{background:#3a6fd8aa}#missions .row b{display:block}#missions .row span{opacity:.9}#missions .row small{display:block;opacity:.75;margin-top:2px}
#missions .act{background:#7a5a10aa;padding:6px 10px;border-radius:8px;margin-bottom:6px}#missions .hint{opacity:.7;font-size:11px;margin-top:6px}#missions button{margin-left:8px;padding:4px 8px;border-radius:7px;border:1px solid #fff5;background:#1a2230;color:#fff}
#tracker{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:rgba(10,14,20,.6);color:#fff;padding:6px 14px;border-radius:10px;font:600 13px system-ui;display:none;pointer-events:none;text-align:center}
#gear{position:fixed;right:14px;top:182px;width:36px;height:36px;border-radius:50%;border:1px solid #fff5;background:#1a2230cc;color:#fff;font-size:18px;z-index:7}
#settings{right:60px;top:150px;width:260px;background:rgba(10,14,20,.9);backdrop-filter:blur(8px);color:#fff;border-radius:12px;padding:10px 12px;font-size:12px;z-index:9;line-height:1.7}#settings h3{margin:0 0 4px;font-size:15px}
#settings .r{display:flex;gap:6px;margin-bottom:6px}#settings button{padding:5px 8px;border-radius:8px;border:1px solid #fff5;background:#1a2230;color:#fff;font:600 12px system-ui}#settings button.on{background:#3a6fd8}#settings .p{opacity:.85;margin-top:4px;font-size:11px}#settings .hint{opacity:.6;font-size:10px;margin-top:4px}
@media (pointer:coarse){#bars{top:10px}#minimap{top:132px}#info{display:none}}@media (pointer:coarse) and (orientation:landscape) and (max-height:500px){#minimap{top:124px;width:118px;height:118px}}
</style></head><body>

<div id="hud"><div class="pill" id="info" style="left:14px;bottom:14px;font-size:11px;opacity:.85">ZQSD : marcher · Maj : courir · C : s'accroupir · F : frapper · T : objet · V : capuche · E : monter / entrer / interagir · 1 manger · 2 boire · 3 soin · G : feu · I : dossiers · N/B : menu (receleur, planque) · R : dormir · X : besoin · L : phares · glisser : regarder</div><button id="reset" class="pill ui" style="right:14px;top:150px;pointer-events:auto;font-size:11px;border:0;color:#fff">Nouvelle partie</button></div>
