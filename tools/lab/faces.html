<!doctype html><meta charset="utf-8"><body style="margin:0"><script type="module">
// Labo : rangée de personnages variés (corpulences, visages, barbes, lunettes) pour vérifier la vague 4.
import * as THREE from 'three';
import { AvatarFactory } from '/src/player/avatar.ts';
import { makeLook } from '/src/npc/appearance.ts';

  const av = F.create({ hoodie: H[i % 8], jeans: J[i % 4], shoes: 0xe8e8e8, hair: look.hairStyle === 'chauve' ? null : look.hairColor, hood: false }, look); av.root.position.x = (i - (n - 1) / 2) * (close ? 0.55 : 1.05); if (q.get('pose')) av.pose(q.get('pose'), 1); s.add(av.root); avs.push(av); }
let t = 0; function frame() { t += 1 / 60; for (const a of avs) a.update(1 / 60); r.render(s, cam); requestAnimationFrame(frame); } frame(); window.__ready = true;
</script>
