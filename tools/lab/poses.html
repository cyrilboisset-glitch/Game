<!doctype html><meta charset="utf-8"><body style="margin:0;font:12px sans-serif"><script type="module">
// Labo : toutes les poses d'action côte à côte (vague 4).
import * as THREE from 'three';
import { AvatarFactory } from '/src/player/avatar.ts';
import { POSES } from '/src/player/poses.ts';
const names = Object.keys(POSES); const W = 1400, H = 600;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, H); r.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x9fb2c2); s.add(new THREE.HemisphereLight(0xffffff, 0x556655, 1.5)); const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(2, 4, 5); s.add(d);
const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100); const side = new URLSearchParams(location.search).has('side'); if (side) { cam.position.set(12, 1.3, 2); cam.lookAt(0, 0.9, 0); } else { cam.position.set(0, 1.3, 13); cam.lookAt(0, 0.9, 0); }
const F = new AvatarFactory(); await F.load('/assets/citizen.glb', '/assets/ual.glb'); const avs = [];
names.forEach((n, i) => { const av = F.create({ hoodie: 0x3d4f6b, jeans: 0x2f4a7a, shoes: 0xe8e8e8, hair: 0x2a1d14, hood: false }); const x = (i - (names.length - 1) / 2) * 1.15; if (side) av.root.position.z = x; else av.root.position.x = x; av.pose(n, 1, true); s.add(av.root); avs.push(av);
  const l = document.createElement('div'); l.textContent = n; l.style.cssText = `position:absolute;top:8px;left:${W / 2 + x * 96 - 20}px`; if (!side) document.body.appendChild(l); });
function frame() { for (const a of avs) a.update(1 / 60); r.render(s, cam); requestAnimationFrame(frame); } frame(); window.__ready = true;
</script>
