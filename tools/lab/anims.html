<!doctype html><meta charset="utf-8"><body style="margin:0;font:11px sans-serif"><script type="module">
// Labo : animations recalées (bibliothèque Quaternius CC0) figées à mi-parcours, une par personnage.
import * as THREE from 'three';
import { AvatarFactory, CLIP_NAMES } from '/src/player/avatar.ts';
const q = new URLSearchParams(location.search); const names = (q.get('n') ?? Object.keys(CLIP_NAMES).join(',')).split(','); const W = 1400, H = 600, cols = Math.min(10, names.length), rows = Math.ceil(names.length / cols);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, H); r.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x9fb2c2); s.add(new THREE.HemisphereLight(0xffffff, 0x556655, 1.5)); const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(2, 4, 5); s.add(d);
const cam = new THREE.PerspectiveCamera(28, W / H, 0.1, 200); const side = q.has('side') ? 1 : 0; cam.position.set(side ? 3 : 0, 1.0 + rows * 1.1, 6 + cols * 1.55); cam.lookAt(0, rows * 1.05 - 1.2, 0);
const F = new AvatarFactory(); await F.load('/assets/citizen.glb', '/assets/ual.glb'); const t = +(q.get('t') ?? 0.5);
names.forEach((n, i) => { const av = F.create({ hoodie: 0x3d4f6b, jeans: 0x2f4a7a, shoes: 0xe8e8e8, hair: 0x2a1d14, hood: false }); const c = i % cols, rr = Math.floor(i / cols); av.root.position.set((c - (cols - 1) / 2) * 1.3, (rows - 1 - rr) * 2.3 - 1.6, 0); if (side) av.root.rotation.y = Math.PI / 2;
  const loop = /Idle|Walk|Run|Sprint|Crouch|Sit$|Drive|Kneel|Talk|Push|PistolIdle|Aim|JumpLoop|SitTalk/.test(n) && !/SitDown|StandUp/.test(n); const dur = loop ? (av.set(n), 1) : av.play(n, { hold: true });
  for (let k = 0; k < 30; k++) av.update(dur * t / 30); s.add(av.root);
  const l = document.createElement('div'); l.textContent = n; l.style.cssText = `position:absolute;left:${(c + 0.5) / cols * W - 30}px;top:${rr / rows * H + 6}px`; document.body.appendChild(l); });
r.render(s, cam); window.__ready = true; window.__ms = F.retargetMs;
</script>
